# Gitleaks rules for this public repo: the default secret rules plus
# environment details that must never be committed (see README).
title = "Infrastructure"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "RFC 1918 IPv4 address. Use 192.0.2.0/24 (documentation range) in committed files."
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''

[[rules]]
id = "mac-address"
description = "MAC address."
regex = '''\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b'''
[[rules.allowlists]]
regexes = ['''(?:00:){5}00''', '''(?i)(?:aa:){5}aa''']

[[rules]]
id = "proxmox-api-token-secret"
description = "Proxmox API token secret."
regex = '''(?i)(?:token_secret|api_token|PVEAPIToken=[^=\s]+=)\s*=?\s*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'''
secretGroup = 1
[[rules.allowlists]]
regexes = ['''00000000-0000-0000-0000-000000000000''']
